<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="description" content="Violet UML Editor cross format document" />
<meta name="keywords" content="Violet, UML" />
<meta name="generator" content="Violet UML Editor ${version}" />
<meta name="color-scheme" content="light dark" />
<title>Violet</title>

<script>
	// Theme before the first paint: the viewer's choice if any, else the system's
	(function() {
		var theme = null;
		try {
			theme = window.localStorage.getItem("violet.diagramFile.theme");
		} catch (e) {
			// Storage refused (private window, file:// restrictions): follow the system.
		}
		if (theme !== "light" && theme !== "dark") {
			theme = window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
		}
		document.documentElement.setAttribute("data-theme", theme);
	})();
</script>
<style>
	:root {
		--bg: #f6f6f8;
		--grid: #d9d8e0;
		--glass: rgba(255, 255, 255, 0.86);
		--text: #1c1b22;
		--muted: #6c6a75;
		--line: #e3e2e8;
		--hover: rgba(28, 27, 34, 0.08);
		--violet: #6c4ebe;
		--violet-hover: #5a3fa6;
		--violet-text: #6c4ebe;
		--sheet: #ffffff;
		--sheet-shadow: 0 1px 2px rgba(0, 0, 0, 0.08), 0 10px 30px rgba(0, 0, 0, 0.10);
		--bar-shadow: 0 4px 16px rgba(0, 0, 0, 0.06);
	}

	/* Dark values: the sheet takes the background of the dark image (DarkDiagramGraphics2D white) */
	:root[data-theme="dark"] {
		--bg: #17161c;
		--grid: #2e2c37;
		--glass: rgba(34, 33, 42, 0.88);
		--text: #ecebf1;
		--muted: #a29fae;
		--line: #36343f;
		--hover: rgba(236, 235, 241, 0.10);
		--violet: #6c4ebe;
		--violet-hover: #7d60d0;
		--violet-text: #b9a4f0;
		--sheet: #26232f;
		--sheet-shadow: 0 0 0 1px #34313e, 0 10px 30px rgba(0, 0, 0, 0.45);
		--bar-shadow: 0 4px 16px rgba(0, 0, 0, 0.3);
		color-scheme: dark;
	}

	* { box-sizing: border-box; }

	html, body {
		margin: 0;
		height: 100%;
		overflow: hidden;
		background: var(--bg);
		color: var(--text);
		font-family: "Segoe UI", system-ui, -apple-system, Roboto, "Helvetica Neue", Arial, sans-serif;
		font-size: 14px;
	}

	/* Diagram canvas: dotted grid, the sheet moves inside it */
	.canvas {
		position: fixed;
		inset: 0;
		overflow: hidden;
		background-color: var(--bg);
		background-image: radial-gradient(var(--grid) 1px, transparent 1px);
		background-size: 18px 18px;
		touch-action: none;
		cursor: grab;
		user-select: none;
		-webkit-user-select: none;
	}

	.canvas.dragging { cursor: grabbing; }

	.stage {
		position: absolute;
		left: 0;
		top: 0;
		transform-origin: 0 0;
	}

	/* Only while the view moves: a layer is fast to move, but the browser keeps the image rasterized at the scale it had, blurred
	   or grainy at another one; without it once the view stops, the image is drawn again, smoothly, at the new scale */
	.stage.moving { will-change: transform; }

	.sheet {
		background: var(--sheet);
		border-radius: 6px;
		box-shadow: var(--sheet-shadow);
		padding: 16px;
	}

	.sheet img {
		display: block;
		max-width: none;
		-webkit-user-drag: none;
		pointer-events: none;
	}

	/* One image per theme, both exported by Violet */
	.diagram-dark { display: none !important; }
	:root[data-theme="dark"] .diagram-light { display: none !important; }
	:root[data-theme="dark"] .diagram-dark { display: block !important; }

	/* Floating top bar */
	.bar {
		position: fixed;
		top: calc(12px + env(safe-area-inset-top, 0px));
		left: calc(12px + env(safe-area-inset-left, 0px));
		right: calc(12px + env(safe-area-inset-right, 0px));
		display: flex;
		align-items: center;
		gap: 8px;
		padding: 7px 8px 7px 10px;
		background: var(--glass);
		-webkit-backdrop-filter: blur(10px);
		backdrop-filter: blur(10px);
		border: 1px solid var(--line);
		border-radius: 14px;
		box-shadow: var(--bar-shadow);
		z-index: 2;
	}

	/* Application icon: white flower on a violet rounded square, the same in both themes */
	.logo {
		width: 30px;
		height: 30px;
		flex: none;
	}

	.title {
		display: flex;
		align-items: baseline;
		gap: 10px;
		min-width: 0;
		flex: 1;
		margin-left: 2px;
	}

	.title h1 {
		margin: 0;
		font-size: 16px;
		font-weight: 600;
		white-space: nowrap;
		overflow: hidden;
		text-overflow: ellipsis;
	}

	.chip {
		flex: none;
		font-size: 12px;
		color: var(--muted);
		border: 1px solid var(--line);
		border-radius: 999px;
		padding: 1px 9px;
		white-space: nowrap;
		display: inline-flex;
		align-items: center;
	}

	.chip[hidden] { display: none; }

	/* Notation of the diagram (UML, BPMN), then a thin line, then its type */
	.chip .notation { font-weight: 600; }

	.chip .chip-separator {
		width: 1px;
		align-self: stretch;
		/* Down to the border of the chip, through its vertical padding */
		margin: -1px 7px;
		background: var(--line);
	}

	.separator {
		flex: none;
		width: 1px;
		height: 22px;
		background: var(--line);
		margin: 0 2px;
	}

	/* Flat buttons of the bar, like MenuBarToolBar's: rounded background on hover */
	.tool {
		font: inherit;
		flex: none;
		width: 30px;
		height: 30px;
		padding: 0;
		border: 0;
		border-radius: 7px;
		background: transparent;
		color: var(--text);
		display: grid;
		place-items: center;
		cursor: pointer;
	}

	.tool:hover { background: var(--hover); }
	.tool svg { width: 18px; height: 18px; }

	.zoom {
		display: flex;
		align-items: center;
		gap: 1px;
		flex: none;
	}

	.zoom .level {
		width: 46px;
		text-align: center;
		font-size: 12px;
		color: var(--muted);
		font-variant-numeric: tabular-nums;
	}

	/* Theme switch, drawn like MenuBarToolBar.ThemeSwitch: sun, track with its knob, moon */
	.theme-switch {
		font: inherit;
		flex: none;
		width: 72px;
		height: 30px;
		padding: 0;
		border: 0;
		background: transparent;
		color: var(--text);
		cursor: pointer;
		display: grid;
		place-items: center;
	}

	.theme-switch svg { width: 72px; height: 16px; overflow: visible; }
	.theme-switch .sun, .theme-switch .moon { fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
	.theme-switch .sun { opacity: 1; }
	.theme-switch .moon { opacity: 0.51; }
	.theme-switch .track { fill: currentColor; opacity: 0.275; }
	.theme-switch:hover .track { opacity: 0.43; }
	.theme-switch .knob { fill: currentColor; transition: transform 0.15s ease; }
	:root[data-theme="dark"] .theme-switch .sun { opacity: 0.51; }
	:root[data-theme="dark"] .theme-switch .moon { opacity: 1; }
	:root[data-theme="dark"] .theme-switch .knob { transform: translateX(14px); }

	/* Violet buttons */
	.btn {
		font: inherit;
		flex: none;
		display: inline-flex;
		align-items: center;
		justify-content: center;
		gap: 7px;
		height: 36px;
		padding: 0 14px;
		border: 0;
		border-radius: 9px;
		background: var(--violet);
		color: #ffffff;
		font-weight: 600;
		text-decoration: none;
		white-space: nowrap;
		cursor: pointer;
	}

	.btn:hover { background: var(--violet-hover); }
	.btn svg { width: 17px; height: 17px; flex: none; }

	/* Black button, like the "Download" button of the website (no dark mode there: a light border keeps it visible on a dark bar) */
	.btn.btn-ink {
		background: #1a1530;
		border-radius: 10px;
	}

	.btn.btn-ink:hover { background: #2c2548; }
	:root[data-theme="dark"] .btn.btn-ink { box-shadow: inset 0 0 0 1px rgba(255, 255, 255, 0.22); }

	/* Credit at the bottom of the page */
	.credit {
		position: fixed;
		left: 50%;
		bottom: calc(12px + env(safe-area-inset-bottom, 0px));
		transform: translateX(-50%);
		max-width: calc(100% - 24px);
		padding: 5px 12px;
		background: var(--glass);
		-webkit-backdrop-filter: blur(10px);
		backdrop-filter: blur(10px);
		border: 1px solid var(--line);
		border-radius: 999px;
		font-size: 12px;
		color: var(--muted);
		white-space: nowrap;
		overflow: hidden;
		text-overflow: ellipsis;
		z-index: 2;
	}

	/* Tells the zoom level when the whole diagram needs less than 100 % to fit in the window */
	.zoom-notice {
		position: fixed;
		left: 50%;
		top: calc(76px + env(safe-area-inset-top, 0px));
		transform: translateX(-50%);
		max-width: calc(100% - 24px);
		padding: 6px 14px;
		background: var(--glass);
		-webkit-backdrop-filter: blur(10px);
		backdrop-filter: blur(10px);
		border: 1px solid var(--line);
		border-radius: 999px;
		box-shadow: var(--bar-shadow);
		font-size: 13px;
		color: var(--text);
		white-space: nowrap;
		overflow: hidden;
		text-overflow: ellipsis;
		pointer-events: none;
		opacity: 0;
		transition: opacity 0.3s ease;
		z-index: 2;
	}

	.zoom-notice.shown { opacity: 1; }
	.zoom-notice strong { color: var(--violet-text); font-variant-numeric: tabular-nums; }

	.credit a {
		color: var(--violet-text);
		font-weight: 600;
		text-decoration: none;
	}

	.credit a:hover { text-decoration: underline; }

	.tool:focus-visible, .theme-switch:focus-visible, .btn:focus-visible {
		outline: 2px solid var(--violet);
		outline-offset: 2px;
	}

	#content { display: none; }

	@media (max-width: 900px) {
		.btn .label { display: none; }
		.btn { width: 38px; padding: 0; }
	}

	/* The full screen button shows the change it makes, hidden where full screen isn't possible (iPhone) */
	.exit-full-screen { display: none; }
	.is-full-screen .enter-full-screen { display: none; }
	.is-full-screen .exit-full-screen { display: block; }
	.no-full-screen .full-screen-part { display: none !important; }

	@media (max-width: 640px) {
		.chip, .zoom .level, .separator { display: none; }
	}

	@media (max-width: 480px) {
		.zoom { display: none; }
		.bar { gap: 6px; }
	}
</style>
<script>
	var APP_VERSION = "${version}";
	var DEVELOPMENT_VERSION = "0.0.0";
	var WEBSITE_URL = "https://violetumleditor.github.io/";
	var DOWNLOAD_BASE_URL = "https://violetumleditor.github.io/product/";
	// Opens the version of the editor that saved this file (the page falls back to the latest one
	// when that version isn't published)
	var ONLINE_EDITOR_URL = DOWNLOAD_BASE_URL + "?version=" + encodeURIComponent(APP_VERSION);
	var ONLINE_EDITOR_ORIGIN = "https://violetumleditor.github.io";
	var ONLINE_TRANSFER_PREFIX = "violet-import-v1:";
	var THEME_KEY = "violet.diagramFile.theme";

	// Notation (as in File > New) and type of each diagram, by file extension
	var DIAGRAM_TYPES = {
		"class": { notation: "UML", name: "Class diagram" },
		"seq": { notation: "UML", name: "Sequence diagram" },
		"activity": { notation: "UML", name: "Activity diagram" },
		"state": { notation: "UML", name: "State diagram" },
		"object": { notation: "UML", name: "Object diagram" },
		"ucase": { notation: "UML", name: "Use case diagram" },
		"bpmn": { notation: "BPMN", name: "Process diagram" }
	};

	function getSuggestedFilename() {
		try {
			var path = decodeURIComponent(window.location.pathname || "");
			var parts = path.split("/");
			var last = parts.length > 0 ? parts[parts.length - 1] : "";
			if (last && last.indexOf(".html") > -1) {
				return last;
			}
		} catch (e) {
			// Ignore and use fallback.
		}
		return "diagram.violet.html";
	}

	function encodeBase64Utf8(text) {
		var bytes = new TextEncoder().encode(text);
		var binary = "";
		var chunkSize = 0x8000;
		for (var i = 0; i < bytes.length; i += chunkSize) {
			binary += String.fromCharCode.apply(null, bytes.subarray(i, i + chunkSize));
		}
		return btoa(binary);
	}

	function openInOnlineEditor() {
		// In HTML5, <script> CDATA sections expose the literal <![CDATA[ ... ]]> markers
		// in textContent — strip them so the receiver gets clean XML.
		var xmlContent = (document.getElementById("content").textContent || "").trim();
		if (xmlContent.startsWith("<![CDATA[") && xmlContent.endsWith("]]>")) {
			xmlContent = xmlContent.slice(9, -3).trim();
		}
		var payload = {
			filename: getSuggestedFilename(),
			sourceVersion: APP_VERSION,
			xmlContent: xmlContent,
			htmlContent: document.documentElement.outerHTML
		};
		var message = { type: ONLINE_TRANSFER_PREFIX, payload: payload };

		var editorWindow = window.open(ONLINE_EDITOR_URL, "_blank");
		if (!editorWindow) {
			window.alert("Popup blocked. Please allow popups and try again.");
			return false;
		}

		var acknowledged = false;
		var onAck = function(event) {
			if (!event || event.source !== editorWindow || !event.data || event.data.type !== "violet-import-ack") {
				return;
			}
			acknowledged = true;
			window.removeEventListener("message", onAck);
		};
		window.addEventListener("message", onAck);

		var attempts = 0;
		var timer = window.setInterval(function() {
			if (acknowledged || editorWindow.closed) {
				window.clearInterval(timer);
				window.removeEventListener("message", onAck);
				return;
			}
			attempts += 1;
			try {
				editorWindow.postMessage(message, ONLINE_EDITOR_ORIGIN);
			} catch (e) {
				// Ignore and retry.
			}
			if (attempts >= 40) {
				window.clearInterval(timer);
				window.removeEventListener("message", onAck);
			}
		}, 250);

		// Keep legacy fallback for environments where message events are filtered.
		editorWindow.name = ONLINE_TRANSFER_PREFIX + encodeBase64Utf8(JSON.stringify(payload));
		editorWindow.focus();
		return false;
	}

	// Title and diagram type from the file name, download button with the Violet version that saved the file
	function showFileIdentity() {
		// Page title as in the online editor: "Violet - " and the file name, "Violet" alone when the page has none
		var fullFilename = getSuggestedFilename();
		document.title = fullFilename === "diagram.violet.html" ? "Violet" : "Violet - " + fullFilename;
		var filename = fullFilename.replace(/\.violet\.html$/i, "").replace(/\.html$/i, "");
		var type = null;
		var dot = filename.lastIndexOf(".");
		if (dot > 0 && DIAGRAM_TYPES[filename.substring(dot + 1).toLowerCase()]) {
			type = DIAGRAM_TYPES[filename.substring(dot + 1).toLowerCase()];
			filename = filename.substring(0, dot);
		}
		if (!filename || filename === "diagram") {
			filename = "Violet UML Diagram";
		}
		document.getElementById("diagramName").textContent = filename;
		document.getElementById("diagramNotation").textContent = type ? type.notation : "";
		document.getElementById("diagramTypeName").textContent = type ? type.name : "";
		document.getElementById("diagramType").hidden = !type;

		// The version of Violet that saved the file, in the credit at the bottom of the page
		var isDevelopmentBuild = APP_VERSION === DEVELOPMENT_VERSION || APP_VERSION.indexOf("$") === 0;
		document.getElementById("creditVersion").textContent = isDevelopmentBuild ? "(development build)" : APP_VERSION;
	}

	function setUpThemeSwitch() {
		var themeSwitch = document.getElementById("themeSwitch");
		function refresh() {
			var isDark = document.documentElement.getAttribute("data-theme") === "dark";
			themeSwitch.setAttribute("aria-checked", String(isDark));
			themeSwitch.title = isDark ? "Light theme" : "Dark theme";
		}
		themeSwitch.addEventListener("click", function() {
			var theme = document.documentElement.getAttribute("data-theme") === "dark" ? "light" : "dark";
			document.documentElement.setAttribute("data-theme", theme);
			refresh();
			try {
				window.localStorage.setItem(THEME_KEY, theme);
			} catch (e) {
				// Not remembered: the next opening follows the system again.
			}
		});
		refresh();
	}

	function getFullScreenElement() {
		return document.fullscreenElement || document.webkitFullscreenElement || null;
	}

	function toggleFullScreen() {
		var root = document.documentElement;
		if (getFullScreenElement()) {
			(document.exitFullscreen || document.webkitExitFullscreen).call(document);
		} else if (root.requestFullscreen) {
			root.requestFullscreen().catch(function() {
				// Refused by the browser: the page stays as it is.
			});
		} else if (root.webkitRequestFullscreen) {
			root.webkitRequestFullscreen();
		}
	}

	// Full screen button: its icon follows the state, which Escape also changes
	function setUpFullScreen() {
		var button = document.getElementById("fullScreen");
		var isSupported = document.fullscreenEnabled || document.webkitFullscreenEnabled;
		if (!isSupported) {
			document.getElementById("bar").classList.add("no-full-screen");
			return;
		}
		function refresh() {
			var isFullScreen = !!getFullScreenElement();
			button.classList.toggle("is-full-screen", isFullScreen);
			button.title = isFullScreen ? "Exit full screen (F)" : "Full screen (F)";
			button.setAttribute("aria-label", isFullScreen ? "Exit full screen" : "Full screen");
		}
		button.addEventListener("click", toggleFullScreen);
		document.addEventListener("fullscreenchange", refresh);
		document.addEventListener("webkitfullscreenchange", refresh);
		refresh();
	}

	// Pan and zoom of the diagram: wheel or pinch zooms around the pointer, drag moves it
	function setUpViewer() {
		var canvas = document.getElementById("canvas");
		var stage = document.getElementById("stage");
		var level = document.getElementById("zoomLevel");
		var MIN_SCALE = 0.1;
		var MAX_SCALE = 8;
		var view = { x: 0, y: 0, scale: 1 };
		// Lowest zoom: MIN_SCALE, or less when the whole diagram needs less to fit in the window
		var minScale = MIN_SCALE;
		var touchedByUser = false;
		var pointers = {};
		var gesture = null;
		var stopMovingTimer = null;
		var notice = document.getElementById("zoomNotice");
		var noticeTimer = null;

		function apply() {
			stage.style.transform = "translate(" + view.x + "px," + view.y + "px) scale(" + view.scale + ")";
			level.textContent = formatScale(view.scale);
			stage.classList.add("moving");
			window.clearTimeout(stopMovingTimer);
			stopMovingTimer = window.setTimeout(function() {
				stage.classList.remove("moving");
			}, 200);
		}

		function formatScale(scale) {
			var percent = scale * 100;
			return (percent < 10 ? Math.round(percent * 10) / 10 : Math.round(percent)) + " %";
		}

		function clampScale(scale) {
			return Math.min(MAX_SCALE, Math.max(minScale, scale));
		}

		// The diagram is shown smaller than it is: tells by how much for a few seconds
		function showZoomNotice() {
			window.clearTimeout(noticeTimer);
			if (view.scale >= 0.995) {
				notice.classList.remove("shown");
				return;
			}
			document.getElementById("zoomNoticeLevel").textContent = formatScale(view.scale);
			notice.classList.add("shown");
			noticeTimer = window.setTimeout(function() {
				notice.classList.remove("shown");
			}, 4000);
		}

		function hideZoomNotice() {
			window.clearTimeout(noticeTimer);
			notice.classList.remove("shown");
		}

		function zoomAt(clientX, clientY, newScale) {
			newScale = clampScale(newScale);
			var ratio = newScale / view.scale;
			view.x = clientX - (clientX - view.x) * ratio;
			view.y = clientY - (clientY - view.y) * ratio;
			view.scale = newScale;
			apply();
		}

		function fit() {
			var bar = document.getElementById("bar").getBoundingClientRect();
			var top = bar.bottom + 16;
			var margin = 16;
			var availableWidth = window.innerWidth - 2 * margin;
			var credit = document.getElementById("credit").getBoundingClientRect();
			var availableHeight = Math.min(window.innerHeight - margin, credit.top - 12) - top;
			var width = stage.offsetWidth;
			var height = stage.offsetHeight;
			if (!width || !height) {
				return;
			}
			// The whole diagram, never enlarged, even below MIN_SCALE for a very large one
			var scale = Math.min(availableWidth / width, availableHeight / height, 1);
			if (!(scale > 0)) {
				return;
			}
			minScale = Math.min(MIN_SCALE, scale);
			view.scale = Math.min(MAX_SCALE, scale);
			view.x = (window.innerWidth - width * view.scale) / 2;
			view.y = top + Math.max(0, (availableHeight - height * view.scale) / 2);
			apply();
		}

		// Fit asked by the user or at the opening: the zoom level is told when the diagram is shown smaller
		function fitAndTell() {
			fit();
			showZoomNotice();
		}

		function zoomFromCenter(factor) {
			touchedByUser = true;
			hideZoomNotice();
			zoomAt(window.innerWidth / 2, window.innerHeight / 2, view.scale * factor);
		}

		canvas.addEventListener("wheel", function(event) {
			event.preventDefault();
			touchedByUser = true;
			hideZoomNotice();
			var delta = event.deltaMode === 1 ? event.deltaY * 16 : event.deltaY;
			zoomAt(event.clientX, event.clientY, view.scale * Math.exp(-delta * (event.ctrlKey ? 0.01 : 0.0015)));
		}, { passive: false });

		function startGesture() {
			var ids = Object.keys(pointers);
			if (ids.length === 1) {
				var p = pointers[ids[0]];
				gesture = { type: "pan", startX: p.x, startY: p.y, viewX: view.x, viewY: view.y };
			} else if (ids.length >= 2) {
				var a = pointers[ids[0]];
				var b = pointers[ids[1]];
				gesture = {
					type: "pinch",
					distance: Math.hypot(b.x - a.x, b.y - a.y) || 1,
					midX: (a.x + b.x) / 2,
					midY: (a.y + b.y) / 2,
					viewX: view.x,
					viewY: view.y,
					scale: view.scale
				};
			} else {
				gesture = null;
			}
		}

		canvas.addEventListener("pointerdown", function(event) {
			canvas.setPointerCapture(event.pointerId);
			pointers[event.pointerId] = { x: event.clientX, y: event.clientY };
			canvas.classList.add("dragging");
			touchedByUser = true;
			hideZoomNotice();
			startGesture();
		});

		canvas.addEventListener("pointermove", function(event) {
			if (!pointers[event.pointerId] || !gesture) {
				return;
			}
			pointers[event.pointerId] = { x: event.clientX, y: event.clientY };
			var ids = Object.keys(pointers);
			if (gesture.type === "pan" && ids.length === 1) {
				view.x = gesture.viewX + event.clientX - gesture.startX;
				view.y = gesture.viewY + event.clientY - gesture.startY;
				apply();
			} else if (gesture.type === "pinch" && ids.length >= 2) {
				var a = pointers[ids[0]];
				var b = pointers[ids[1]];
				var scale = clampScale(gesture.scale * Math.hypot(b.x - a.x, b.y - a.y) / gesture.distance);
				var midX = (a.x + b.x) / 2;
				var midY = (a.y + b.y) / 2;
				var ratio = scale / gesture.scale;
				view.x = midX - (gesture.midX - gesture.viewX) * ratio;
				view.y = midY - (gesture.midY - gesture.viewY) * ratio;
				view.scale = scale;
				apply();
			}
		});

		function endPointer(event) {
			delete pointers[event.pointerId];
			if (Object.keys(pointers).length === 0) {
				canvas.classList.remove("dragging");
			}
			startGesture();
		}

		canvas.addEventListener("pointerup", endPointer);
		canvas.addEventListener("pointercancel", endPointer);

		canvas.addEventListener("dblclick", function(event) {
			touchedByUser = true;
			if (view.scale < 0.99) {
				hideZoomNotice();
				zoomAt(event.clientX, event.clientY, 1);
			} else {
				touchedByUser = false;
				fitAndTell();
			}
		});

		document.getElementById("zoomOut").addEventListener("click", function() { zoomFromCenter(1 / 1.25); });
		document.getElementById("zoomIn").addEventListener("click", function() { zoomFromCenter(1.25); });

		document.addEventListener("keydown", function(event) {
			if (event.ctrlKey || event.metaKey || event.altKey) {
				return;
			}
			if (event.key === "+" || event.key === "=") {
				zoomFromCenter(1.25);
			} else if (event.key === "-") {
				zoomFromCenter(1 / 1.25);
			} else if (event.key === "0") {
				touchedByUser = false;
				fitAndTell();
			} else if (event.key === "f" || event.key === "F") {
				toggleFullScreen();
			}
		});

		window.addEventListener("resize", function() {
			if (!touchedByUser) {
				fit();
			}
		});

		// Entering or leaving full screen fits the diagram to the new size
		["fullscreenchange", "webkitfullscreenchange"].forEach(function(name) {
			document.addEventListener(name, function() {
				touchedByUser = false;
				window.setTimeout(fit, 50);
			});
		});

		// The whole diagram at the opening. The images carry their size (in graph units, they have more pixels than that), so the
		// page knows it before decoding them; files of older versions don't, and wait for the image.
		var image = document.getElementById("diagramPreview");
		if (image.complete || image.getAttribute("width")) {
			fitAndTell();
		} else {
			image.addEventListener("load", fitAndTell);
		}
	}

	document.addEventListener("DOMContentLoaded", function() {
		showFileIdentity();
		setUpThemeSwitch();
		setUpFullScreen();
		setUpViewer();
	});
</script>
</head>
<body>
	<main class="canvas" id="canvas" aria-label="Diagram, drag to move, scroll or pinch to zoom">
		<div class="stage" id="stage">
			<div class="sheet">
				<img id="diagramPreview" class="diagram-light" alt="Diagram" src="${image}" width="${imageWidth}" height="${imageHeight}" />
				<img id="diagramPreviewDark" class="diagram-dark" alt="Diagram" src="${imageDark}" width="${imageWidth}" height="${imageHeight}" />
			</div>
		</div>
	</main>

	<div class="zoom-notice" id="zoomNotice" role="status" aria-live="polite">Zoomed out to <strong id="zoomNoticeLevel">100 %</strong> to show the whole diagram</div>

	<header class="bar" id="bar">
		<svg class="logo" viewBox="0 0 24 24" role="img" aria-label="Violet UML Editor">
			<rect width="24" height="24" rx="5.4" fill="#6C4EBE"/>
			<g fill="#ffffff" transform="translate(3.36 3.36) scale(0.72) translate(12 12.5)"><path transform="rotate(-84)" d="M2.2 0C5.050 -3.410 9.690 -4.185 11.4 0C9.690 4.185 5.050 3.410 2.2 0Z"/><path transform="rotate(-8)" d="M2.2 0C5.000 -3.080 9.520 -3.780 11.2 0C9.520 3.780 5.000 3.080 2.2 0Z"/><path transform="rotate(58)" d="M2.2 0C4.450 -2.970 7.650 -3.645 9.0 0C7.650 3.645 4.450 2.970 2.2 0Z"/><path transform="rotate(124)" d="M2.2 0C4.450 -2.970 7.650 -3.645 9.0 0C7.650 3.645 4.450 2.970 2.2 0Z"/><path transform="rotate(188)" d="M2.2 0C5.000 -3.080 9.520 -3.780 11.2 0C9.520 3.780 5.000 3.080 2.2 0Z"/></g>
		</svg>
		<div class="title">
			<h1 id="diagramName">Violet UML Diagram</h1>
			<span class="chip" id="diagramType" hidden><span class="notation" id="diagramNotation"></span><span class="chip-separator" aria-hidden="true"></span><span id="diagramTypeName"></span></span>
		</div>

		<div class="zoom" role="group" aria-label="Zoom">
			<button type="button" class="tool" id="zoomOut" title="Zoom out (-)" aria-label="Zoom out">
				<svg viewBox="0 0 24 24" aria-hidden="true"><path stroke="currentColor" stroke-width="1.8" stroke-linecap="round" d="M5 12h14"/></svg>
			</button>
			<span class="level" id="zoomLevel">100 %</span>
			<button type="button" class="tool" id="zoomIn" title="Zoom in (+)" aria-label="Zoom in">
				<svg viewBox="0 0 24 24" aria-hidden="true"><path stroke="currentColor" stroke-width="1.8" stroke-linecap="round" d="M12 5v14M5 12h14"/></svg>
			</button>
		</div>
		<span class="separator" aria-hidden="true"></span>

		<button type="button" class="theme-switch" id="themeSwitch" role="switch" aria-checked="false" aria-label="Dark theme">
			<svg viewBox="0 0 72 16" aria-hidden="true">
				<g class="sun" transform="scale(0.6667)">
					<circle cx="12" cy="12" r="4.5"/>
					<path d="M12 2v2.5M19.07 4.93l-1.77 1.77M22 12h-2.5M19.07 19.07l-1.77-1.77M12 22v-2.5M4.93 19.07l1.77-1.77M2 12h2.5M4.93 4.93l1.77 1.77"/>
				</g>
				<rect class="track" x="21" y="0" width="30" height="16" rx="8"/>
				<circle class="knob" cx="29" cy="8" r="5"/>
				<g class="moon" transform="translate(56 0) scale(0.6667)">
					<path d="M11.489 3.014A9 9 0 1 0 20.707 14.280A7.5 7.5 0 0 1 11.489 3.014Z"/>
				</g>
			</svg>
		</button>
		<span class="separator full-screen-part" aria-hidden="true"></span>
		<!-- Full screen, drawn like ToolShapes.FULL_SCREEN / EXIT_FULL_SCREEN: four corners outwards / inwards -->
		<button type="button" class="tool full-screen-part" id="fullScreen" title="Full screen (F)" aria-label="Full screen">
			<svg class="enter-full-screen" viewBox="0 0 24 24" aria-hidden="true"><g fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M8 3H5Q3 3 3 5V8"/><path d="M8 3H5Q3 3 3 5V8" transform="rotate(90 12 12)"/><path d="M8 3H5Q3 3 3 5V8" transform="rotate(180 12 12)"/><path d="M8 3H5Q3 3 3 5V8" transform="rotate(270 12 12)"/></g></svg>
			<svg class="exit-full-screen" viewBox="0 0 24 24" aria-hidden="true"><g fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M8 3V6Q8 8 6 8H3"/><path d="M8 3V6Q8 8 6 8H3" transform="rotate(90 12 12)"/><path d="M8 3V6Q8 8 6 8H3" transform="rotate(180 12 12)"/><path d="M8 3V6Q8 8 6 8H3" transform="rotate(270 12 12)"/></g></svg>
		</button>

		<a class="btn btn-ink" id="getTheApp" href="https://violetumleditor.github.io/" target="_blank" rel="noopener noreferrer" title="Violet UML Editor website" aria-label="Get Violet. It's free!">
			<svg viewBox="0 0 24 24" aria-hidden="true"><path fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" d="M12 3v12M7 10l5 5 5-5M5 21h14"/></svg>
			<span class="label">Get Violet. It's free!</span>
		</a>
		<a class="btn" href="#" onclick="return openInOnlineEditor();" title="Open in the online editor" aria-label="Edit online">
			<svg viewBox="0 0 24 24" aria-hidden="true"><path fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" d="M4 20h4L19 9l-4-4L4 16v4zM14 6l4 4"/></svg>
			<span class="label">Edit online</span>
		</a>
	</header>

	<footer class="credit" id="credit">
		This diagram was made with <a href="https://violetumleditor.github.io/" target="_blank" rel="noopener noreferrer">Violet UML Editor</a> <span id="creditVersion">${version}</span>
	</footer>

	<script id="content" type="text/xml"><![CDATA[${content}]]></script>
</body>
</html>
