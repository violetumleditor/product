# Publishes the jar of a work branch next to the released one on GitHub Pages, to try it for real in a browser:
#   https://violetumleditor.github.io/product/?version=<branch with "/" replaced by "-">
# e.g. branch perf/rendu -> ?version=perf-rendu (also ?version=perf-rendu-<short commit> for one precise build).
# Nothing else changes on the site: index.html, violetumleditor-latest.jar and the version jars stay those of master,
# and nothing is deployed to GitHub Packages nor SourceForge.

name: Branch preview

on:
  push:
    branches:
      - 'perf/**'
      - 'preview/**'
  workflow_dispatch:

# Two previews never push to gh-pages at the same time
concurrency:
  group: gh-pages
  cancel-in-progress: false

jobs:
  preview:
    if: github.ref != 'refs/heads/master'
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
    - name: Checkout source code
      uses: actions/checkout@v4

    - name: Set up JDK
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'
        cache: maven

    - name: Build and test
      run: mvn -B package

    - name: Prepare the branch jar for GitHub Pages
      run: |
        set -euo pipefail
        SLUG=$(echo "${GITHUB_REF_NAME}" | tr '/' '-' | tr -c 'A-Za-z0-9._-' '-' | sed 's/-*$//')
        SHORT_SHA=$(git rev-parse --short=7 HEAD)
        JAR=$(find violetproduct-swing/target -maxdepth 1 -type f -name 'violetumleditor-*.jar' ! -name '*-sources.jar' ! -name '*-javadoc.jar' | sort -V | tail -n 1)
        if [ -z "$JAR" ]; then
          echo "No violetumleditor jar found in violetproduct-swing/target"
          exit 1
        fi
        mkdir -p gh-pages-preview
        cp "$JAR" "gh-pages-preview/violetumleditor-${SLUG}.jar"
        cp "$JAR" "gh-pages-preview/violetumleditor-${SLUG}-${SHORT_SHA}.jar"
        {
          echo "### Preview of ${GITHUB_REF_NAME}"
          echo ""
          echo "- Latest build of the branch: https://violetumleditor.github.io/product/?version=${SLUG}"
          echo "- This commit: https://violetumleditor.github.io/product/?version=${SLUG}-${SHORT_SHA}"
        } >> "$GITHUB_STEP_SUMMARY"

    - name: Publish the branch jar to GitHub Pages
      uses: peaceiris/actions-gh-pages@v4
      with:
        github_token: ${{ github.token }}
        publish_branch: gh-pages
        publish_dir: gh-pages-preview
        keep_files: true
        commit_message: "Preview of ${{ github.ref_name }} (${{ github.sha }})"
