# This workflow will build a package using Maven and then publish it to GitHub packages when a release is created
# For more information see: https://github.com/actions/setup-java/blob/main/docs/advanced-usage.md#apache-maven-with-a-settings-path

name: Maven Package

env:
  # Setting environment variables with values of secrets (organisation wide)
  SOURCEFORGE_USERNAME: ${{ secrets.SOURCEFORGE_USERNAME }}
  SOURCEFORGE_PASSWORD: ${{ secrets.SOURCEFORGE_PASSWORD }}


on:
  push:
    branches:
      - master

jobs:
  build:

    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
      id-token: write

    steps:
    - name: Checkout source code
      uses: actions/checkout@v3

    - name: Set up JDK
      uses: actions/setup-java@v3
      with:
        java-version: '21'
        distribution: 'temurin'
        server-id: github # Value of the distributionManagement/repository/id field of the pom.xml
        settings-path: ${{ github.workspace }} # location for the settings.xml file

    - name: Inject dynamic app version and release date into property bundles
      run: |
        set -euo pipefail
        APP_VERSION=$(mvn -q -DforceStdout help:evaluate -Dexpression=applicationVersion)
        APP_VERSION=$(printf '%s\n' "$APP_VERSION" | tail -n 1)
        COMPILE_DATE=$(date -u +%F)

        for file in violet-framework/src/main/resources/properties/OtherStrings*.properties; do
          if [ ! -f "$file" ]; then
            continue
          fi
          sed -i -E "s/^app\.version\.number=.*/app.version.number=${APP_VERSION}/" "$file"
          sed -i -E "s/^app\.release\.date=.*/app.release.date=${COMPILE_DATE}/" "$file"
        done

        echo "Injected app.version.number=${APP_VERSION}"
        echo "Injected app.release.date=${COMPILE_DATE}"

    - name: Build and publish to GitHub Packages Apache Maven and Sourceforge.net
      run: mvn -B package deploy -s $GITHUB_WORKSPACE/settings.xml
      env:
        GITHUB_TOKEN: ${{ github.token }}

    - name: Prepare latest Swing jar, index.html and icons for GitHub Pages
      run: |
        set -euo pipefail
        mkdir -p gh-pages-download
        LATEST_JAR=$(find violetproduct-swing/target -maxdepth 1 -type f -name 'violetumleditor-*.jar' ! -name '*-sources.jar' ! -name '*-javadoc.jar' | sort -V | tail -n 1)
        if [ -z "$LATEST_JAR" ]; then
          echo "No violetumleditor jar found in violetproduct-swing/target"
          exit 1
        fi
        cp "$LATEST_JAR" gh-pages-download/violetumleditor-latest.jar
        JAR_FILENAME=$(basename "$LATEST_JAR")
        VERSION=${JAR_FILENAME#violetumleditor-}
        VERSION=${VERSION%.jar}
        printf '%s\n' "$VERSION" > gh-pages-download/violetumleditor-latest-version.txt

        WEB_INDEX="violetproduct-swing/src/main/resources/web/index.html"
        if [ ! -f "$WEB_INDEX" ]; then
          echo "Missing web index file: $WEB_INDEX"
          exit 1
        fi
        cp "$WEB_INDEX" gh-pages-download/index.html
        WEB_DIR=$(dirname "$WEB_INDEX")
        cp "$WEB_DIR/favicon.ico" "$WEB_DIR/favicon.svg" "$WEB_DIR/apple-touch-icon.png" gh-pages-download/

    - name: Publish latest Swing jar and index.html to GitHub Pages
      uses: peaceiris/actions-gh-pages@v4
      with:
        github_token: ${{ github.token }}
        publish_branch: gh-pages
        publish_dir: gh-pages-download
        keep_files: true


